# 10 Nango-driven streams, 90 simulated days delivered over 90 wall-minutes.
# Each stream: 4 ticks/min × 90 min = 360 records. Driven by
# `src/quarter-compressed.ts` with --wall-minutes 90 --sim-days 90 (1440x clock).
streams:
  - name: gmail
    kind: sync
    provider: gmail
    connectionId: gm-acme-90m
    providerConfigKey: google-mail
    model: messages
    ratePerMinute: 4
    jitter: 0
    maxCount: 360
  - name: drive
    kind: sync
    provider: drive
    connectionId: dr-acme-90m
    providerConfigKey: google-drive
    model: files
    ratePerMinute: 4
    jitter: 0
    maxCount: 360
  - name: calendar
    kind: sync
    provider: calendar
