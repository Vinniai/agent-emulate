# Reference seed overlay for `pnpm quarter-all`.
#
# Merge these two top-level blocks into the emulate config (`--seed` /
# EMULATE_CONFIG_PATH) of your per-port server. They give `simpro-sim` and
# `uptick-sim` the exact root rows their REMOTE crawl links to — without them
# the SimPro crawl reports 27/29 shape gaps (master cost center + technician
# refs don't resolve).
#
# Apply with either:
#   1) Append the two blocks to your emulate.config.yaml (replace any existing
#      simpro: / uptick: sections), or
#   2) Pass this file directly:  npx emulate start --seed quarter-all.seed.yaml
#
# Pairs with `src/quarter-all.ts` (the wrapper) and
# `scenarios/quarter-all10-90min.yaml` (the 10-Nango-stream compressed run).

