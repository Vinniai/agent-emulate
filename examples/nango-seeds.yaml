# examples/nango-seeds.yaml
#
# Seed library for popular Nango providers, drop-in for emulate.config.yaml.
# Copy any `connections:` entries you need under your top-level `nango:` key.
#
# Each seed gives you:
#   * a connection that `GET /connections/<id>` resolves
#   * 1–2 representative models with 2–3 rows of realistic field shapes
#     that round-trip through `GET /records?model=<Model>` with the
#     `Connection-Id` + `Provider-Config-Key` headers
#
# Field shapes follow each provider's real API so you can swap the emulator
# for production later without rewriting client code. Tokens, IDs, and dates
# are synthetic.
#
# Run the emulator after editing your config:
#
#   npx agent-emulate start
#
# Then exercise a seed:
#
#   curl -H "Connection-Id: salesforce-acme" \
#        -H "Provider-Config-Key: salesforce" \
#        "http://localhost:4030/records?model=Account"

nango:
  connections:
    # ============================================================
    # CRM
    # ============================================================

    - id: salesforce-acme
      provider: salesforce
      provider_config_key: salesforce
      connection_config:
        instance_url: https://acme.my.salesforce.com
      metadata:
        organizationId: org_acme
      records:
        # Salesforce SOQL responses wrap each row in an `attributes`
        # envelope carrying the sobject `type` and the REST `url` for the row.
        # Any client that hits /query?q=... sees this shape — including the
        # official SDKs (jsforce, nforce, salesforce-node). Drop the envelope
        # only when you fetch a single record via /sobjects/<Type>/<Id>.
        Account:
          - attributes:
              type: Account
              url: /services/data/v59.0/sobjects/Account/0011x00000ABCDEAA1
            Id: 0011x00000ABCDEAA1
            Name: Acme Corp
            Industry: Technology
            AnnualRevenue: 5400000
            NumberOfEmployees: 42
            BillingCountry: US
            CreatedDate: "2025-01-12T09:14:00.000Z"
          - attributes:
              type: Account
              url: /services/data/v59.0/sobjects/Account/0011x00000ABCDFAA2
            Id: 0011x00000ABCDFAA2
            Name: Globex Manufacturing
            Industry: Manufacturing
            AnnualRevenue: 18200000
            NumberOfEmployees: 215
            BillingCountry: US
            CreatedDate: "2024-08-30T16:02:00.000Z"
        Contact:
          - attributes:
              type: Contact
              url: /services/data/v59.0/sobjects/Contact/0031x00000XYZ01AA1
            Id: 0031x00000XYZ01AA1
            FirstName: Lena
            LastName: Park
            Email: lena.park@agent-emulate.dev
            AccountId: 0011x00000ABCDEAA1
            Title: VP Engineering
          - attributes:
